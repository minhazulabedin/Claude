<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#02030a"/>
    </linearGradient>
    <linearGradient id="eq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#7af9ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#grid)"/>
  <g filter="url(#glow)">
    <rect x="118" y="178" width="276" height="38" rx="10" fill="url(#eq)"/>
    <rect x="118" y="296" width="276" height="38" rx="10" fill="url(#eq)"/>
  </g>
  <g opacity="0.85">
    <rect x="372" y="118" width="22" height="22" rx="4" fill="#ff2bd6"/>
    <rect x="372" y="372" width="22" height="22" rx="4" fill="#ff2bd6" opacity="0.6"/>
  </g>
  <text x="56" y="92" font-family="Orbitron, sans-serif" font-weight="900" font-size="32" fill="#7af9ff" letter-spacing="6">NEO//</text>
</svg>
