<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="NEO//ROUTINE — a futuristic neon class routine with live next-class countdown, weekly grid and offline support." />
    <title>NEO//ROUTINE</title>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#05060c" />
    <meta name="color-scheme" content="dark" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEO//ROUTINE" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="grid-bg" aria-hidden="true"></div>
    <div class="glow-orb glow-orb--cyan" aria-hidden="true"></div>
    <div class="glow-orb glow-orb--magenta" aria-hidden="true"></div>

    <main class="device" id="app">
      <header class="device-head">
        <div class="brand">
          <span class="brand-mark">NEO</span><span class="brand-slash">//</span><span class="brand-mark">ROUTINE</span>
          <span class="brand-ver">v1.0</span>
        </div>
        <button class="icon-btn" id="todayBtn" type="button" aria-label="Jump to today">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>
        </button>
      </header>

      <section class="next" id="next" hidden>
        <div class="next-label">
          <span class="pulse" aria-hidden="true"></span>
          <span id="nextLabel">NEXT UP</span>
        </div>
        <div class="next-course" id="nextCourse">—</div>
        <div class="next-meta" id="nextMeta">—</div>
        <div class="next-count" id="nextCount">—</div>
      </section>

      <nav class="day-tabs" id="dayTabs" role="tablist"></nav>

      <section class="board" id="board"></section>

      <footer class="device-foot">
        <span id="footStat">—</span>
      </footer>
    </main>

    <script src="app.js" defer></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
